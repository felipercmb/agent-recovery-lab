name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: Verify installed package and recovery controls
        run: bash scripts/verify.sh --installed
        env:
          PYTHON_BIN: python
          REPORT_DIR: reports
      - name: Upload recovery reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-reports-python-${{ matrix.python-version }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 14
